services:

  comfyui:
    init: true
    container_name: comfyui
    build:
      context: .
      dockerfile: Dockerfile
    image: "chenhanjiang/comfyui-bot:cuda13.0"
    ports:
      - "8188:8188"
    volumes:
      - "${DOCKER_PATH}/storage:/root"
      - "${DOCKER_PATH}/storage-models/models:/root/ComfyUI/models"
      - "${DOCKER_PATH}/storage-models/hf-hub:/root/.cache/huggingface/hub"
      - "${DOCKER_PATH}/storage-models/torch-hub:/root/.cache/torch/hub"
      - "${DOCKER_PATH}/storage-user/input:/root/ComfyUI/input"
      - "${DOCKER_PATH}/storage-user/output:/root/ComfyUI/output"
      - "${DOCKER_PATH}/storage-user/workflows:/root/ComfyUI/user/default/workflows"
    environment:
      - CLI_ARGS=
    command:
      - bash
      - -lc
      - |
        pip install -c /builder-scripts/constraints.txt \
          -r /default-comfyui-bundle/ComfyUI/requirements.txt \
          -r /default-comfyui-bundle/ComfyUI/custom_nodes/ComfyUI-Manager/requirements.txt \
          -i https://repo.huaweicloud.com/repository/pypi/simple \
          --extra-index-url https://pypi.org/simple \
        && bash /runner-scripts/entrypoint.sh
    security_opt:
      - "label=type:nvidia_container_t"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]